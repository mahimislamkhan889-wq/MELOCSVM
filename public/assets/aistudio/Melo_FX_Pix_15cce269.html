const hash=s=>{let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0};
const rngF=s=>{let a=hash(String(s));return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
/* ========== EFFECT ENGINE (27 families, drawn on a transparent layer) ========== */
function effect(ctx,W,H,fam,pal,seed,par){
const R=rngF(seed),rr=(a,b)=>a+(b-a)*R(),g=()=>(R()+R()+R()+R()-2)*1.73,TAU=6.2832;
const U=H/2532*par.sz,af=W*H/(2250*2532),N=n=>Math.max(1,Math.round(n*par.d*af)),it=par.it;
const K=(i,dl=0)=>{const p=pal[((i%3)+3)%3];return a=>`hsla(${(p[0]+par.hue)%360},${p[1]}%,${Math.max(0,Math.min(100,p[2]+dl))}%,${Math.max(0,Math.min(1,a))})`};
const gl=(x,y,r,c,a)=>{const q=ctx.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,c(a));q.addColorStop(.35,c(a*.35));q.addColorStop(1,c(0));ctx.fillStyle=q;ctx.fillRect(x-r,y-r,2*r,2*r)};
const dt=(x,y,r,c,a)=>{const q=ctx.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,c(a));q.addColorStop(.55,c(a*.85));q.addColorStop(1,c(0));ctx.fillStyle=q;ctx.fillRect(x-r,y-r,2*r,2*r)};
const bk=(x,y,r,c,a)=>{const q=ctx.createRadialGradient(x,y,r*.1,x,y,r);q.addColorStop(0,c(a*.12));q.addColorStop(.8,c(a*.22));q.addColorStop(.95,c(a*.65));q.addColorStop(1,c(0));ctx.fillStyle=q;ctx.fillRect(x-r,y-r,2*r,2*r)};
const fl=(x,y,L,c,a,rot=0)=>{gl(x,y,L*.3,c,a);ctx.save();ctx.translate(x,y);ctx.rotate(rot);for(const[an,ln]of[[0,1],[1.5708,1],[.7854,.5],[-.7854,.5]]){ctx.save();ctx.rotate(an);const q=ctx.createLinearGradient(-L*ln,0,L*ln,0);q.addColorStop(0,c(0));q.addColorStop(.5,c(a));q.addColorStop(1,c(0));ctx.fillStyle=q;ctx.beginPath();ctx.ellipse(0,0,L*ln,Math.max(1,L*.012),0,0,TAU);ctx.fill();ctx.restore()}ctx.restore();dt(x,y,L*.07,K(2),a)};

const tr=(p,w,c,a)=>{ctx.lineCap='round';ctx.lineJoin='round';for(const[k,al]of[[3.2,.1],[1.8,.22],[1,.55],[.4,1]]){path(p);ctx.lineWidth=Math.max(.5,w*k);ctx.strokeStyle=c(a*al);ctx.stroke()}};
const tp=(p,w,c,a,mode)=>{ctx.lineCap='butt';for(const[k,al]of[[3.2,.1],[1.8,.22],[1,.55],[.4,1]])for(let i=1;i<p.length;i++){const t=i/p.length,s=mode==1?Math.pow(Math.sin(Math.PI*t),.7):mode==2?Math.pow(t,.8):Math.pow(1-t,.8);ctx.beginPath();ctx.moveTo(p[i-1][0],p[i-1][1]);ctx.lineTo(p[i][0],p[i][1]);ctx.lineWidth=Math.max(.5,w*k*s);ctx.strokeStyle=c(a*al*(.25+.75*s));ctx.stroke()}};
const dust=n=>{for(let i=0,m=N(n);i<m;i++)dt(R()*W,R()*H,U*rr(1,3.5),K(2),rr(.15,.6)*it)};
const leaf=(x,y,s,rot,c1,c2)=>{ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.beginPath();for(let k=0;k<=60;k++){const a=k/60*TAU,r=s*(.6+.4*Math.pow(Math.abs(Math.cos(a*2.5)),.55)*(1+.12*Math.sin(a*5)));k?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();const q=ctx.createLinearGradient(-s,-s,s,s);q.addColorStop(0,c1);q.addColorStop(1,c2);ctx.fillStyle=q;ctx.fill();ctx.strokeStyle=c2;ctx.lineWidth=Math.max(1,s*.03);for(let a=0;a<5;a++){ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a*1.2566)*s*.8,Math.sin(a*1.2566)*s*.8);ctx.stroke()}ctx.restore()};
const F=[];
F[0]=()=>{for(let i=0,n=N(2600);i<n;i++){const y=H*Math.pow(R(),2.1),x=R()*W,f=1-y/H,r=U*(2+Math.pow(R(),3)*(R()<.05?50:12)),a=(.25+R()*.6)*(.35+f)*it;R()<.12?bk(x,y,r*2.4,K(1,-10),a*.8):dt(x,y,r,K(2,R()<.5?-28:0),a)}};
