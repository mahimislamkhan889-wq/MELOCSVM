*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#111216;color:#eee;font:14px system-ui,Segoe UI,sans-serif;display:grid;grid-template-columns:340px 1fr;grid-template-rows:auto 1fr}
header{grid-column:1/3;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#181a21;border-bottom:1px solid #2b2e38}

.row{display:block;margin:0 0 10px;font-size:12.5px;color:#c4c8d2}.row span{display:flex;justify-content:space-between}.row output{color:#8f95a3}
.row input[type=range],.row select,.row input[type=number]{width:100%;margin-top:3px}.row select,.row input[type=number]{background:#2b2e38;color:#fff;border:0;border-radius:6px;padding:6px}
.row input[type=color]{width:100%;height:30px;border:0;background:none;padding:0}.row.k{display:flex;gap:8px;align-items:center}
main{overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center}
.stage{background:repeating-conic-gradient(#222 0 25%,#2a2a2a 0 50%) 0 0/24px 24px;border-radius:8px;overflow:hidden;box-shadow:0 10px 40px #0008;flex:none}.stage svg{width:100%;height:100%;display:block}
#info,#msg{margin-top:10px;text-align:center;color:#9aa0aa}#msg.err{color:#ff7675}
#tg{display:none}
@media(max-width:820px){body{grid-template-columns:1fr}header{grid-column:1}#tg{display:inline-block}#side{position:fixed;inset:56px 0 0 0;z-index:5;display:none}#side.open{display:block}}

<script>
let W=3840,H=2160;
const mk=s=>{let a=s>>>0;return(l,h)=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;const v=((t^t>>>14)>>>0)/4294967296;return l===undefined?v:l+v*(h-l)}};
const q=Math.round,f2=v=>v.toFixed(2),f4=v=>v.toFixed(4),P2=Math.PI*2;
const rgb=h=>[1,3,5].map(i=>f2(parseInt(h.substr(i,2),16)/255)).join(' ').split(' ');
const PAL=[
['Noir','#f4f4f2','#111111','#444444','#888888','#ffffff'],
['Inverse','#0d0d0f','#f2f2f2','#aaaaaa','#555555','#222222'],
['Film','#0b1316','#d9a07a','#c76b7a','#e8d5c4','#1d3b42'],
['Sunset','#2b1055','#ff6a3d','#ff2e63','#ffd166','#7b2ff7'],
['Ocean','#03253d','#00b4d8','#90e0ef','#0077b6','#caf0f8'],
['Forest','#10261a','#52b788','#95d5b2','#2d6a4f','#d8f3dc'],
['Candy','#fff0f6','#ff6fb5','#6ec6ff','#ffd86b','#b388ff'],
['Royal Blue','#0a1a3a','#4a7dff','#9bb8ff','#1f3b8a','#e6eeff'],
['Retro','#f3e4c3','#d1495b','#edae49','#00798c','#30638e'],
['Neon','#07070f','#00ffd5','#ff00aa','#fff200','#7a00ff'],
['Pastel Spring','#f7fbef','#9bd88a','#f6a6c1','#ffd96a','#8ec5ff'],
['Gold & Black','#0c0a07','#d4af37','#a67c00','#f3e0a0','#5a4310'],
['Terracotta','#f1e3d3','#c8553d','#e09f3e','#335c67','#9e2a2b'],
['Mint Ice','#eefaf7','#2ec4b6','#cbf3f0','#ff9f1c','#1b3a4b'],
['Plum Wine','#1c0b1f','#c44569','#f8a5c2','#786fa6','#f5cd79'],
['Slate Pop','#20232a','#61dafb','#ff6b6b','#feca57','#a29bfe']
].map(a=>({n:a[0],bg:a[1],a:a[2],b:a[3],c:a[4],d:a[5],dark:(parseInt(a[1].substr(1,2),16)*.3+parseInt(a[1].substr(3,2),16)*.6+parseInt(a[1].substr(5,2),16)*.1)<110}));
const cols=P=>[P.a,P.b,P.c,P.d];
const pk=(R,a)=>a[(R()*a.length)|0];
// helpers
function ht(R,col,mode,shape,k,sz){const ds=sz||q(R(34,60)),ang=q(R(-45,45));
 const pat=mode==0?`<circle cx="${ds/2}" cy="${ds/2}" r="${f2(ds*.34)}" fill="${col}"/>`:mode==1?`<rect y="${f2(ds*.35)}" width="${ds}" height="${f2(ds*.3)}" fill="${col}"/>`:`<path d="M0 ${ds/2}H${ds}M${ds/2} 0V${ds}" stroke="${col}" stroke-width="${f2(ds*.16)}"/>`;
 let sh='';const tilt=R(-25,25),c=q(R(8,16));
 for(let j=0;j<c;j++){const x=q(R(-300,W)),y=q(R(-100,H));
  sh+=shape==0?`<rect x="${x}" y="${y}" width="${q(R(W*.3,W*1.1))}" height="${q(R(50,260))}" transform="rotate(${q(tilt+R(-6,6))} ${x} ${y})" opacity="${f2(R(.5,1))}"/>`:`<circle cx="${x}" cy="${y}" r="${q(R(150,700))}" opacity="${f2(R(.5,1))}"/>`}
 return `<defs><pattern id="p${k}" width="${ds}" height="${ds}" patternUnits="userSpaceOnUse" patternTransform="rotate(${ang})">${pat}</pattern><filter id="f${k}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${q(R(25,70))}"/></filter><mask id="m${k}"><rect width="${W}" height="${H}"/><g fill="#fff" filter="url(#f${k})">${sh}</g></mask></defs><rect width="${W}" height="${H}" fill="url(#p${k})" mask="url(#m${k})"/>`}
function nl(R,id,col,bx,by,oct,t,gain,op){const [r,g,b]=rgb(col);return `<filter id="${id}" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="${f4(bx)} ${f4(by)}" numOctaves="${oct}" seed="${q(R(1,999))}"/><feColorMatrix values="0 0 0 0 ${r} 0 0 0 0 ${g} 0 0 0 0 ${b} ${gain} 0 0 0 ${-gain*t}"/></filter><rect width="${W}" height="${H}" filter="url(#${id})" opacity="${op}"/>`}
function scratch(R,col,n){let d='';for(let i=0;i<n;i++){d+=`M${q(R(0,W))} ${q(R(0,H))}l${q(R(-500,500))} ${q(R(-60,60))}`}return `<path d="${d}" stroke="${col}" stroke-width="2" opacity=".45" fill="none"/>`}
function dust(R,col,n){let d='',e='';for(let i=0;i<n;i++){const x=q(R(0,W)),y=q(R(0,H));d+=`M${x} ${y}q${q(R(-25,25))} ${q(R(-25,25))} ${q(R(-30,30))} ${q(R(-30,30))}`;e+=`M${q(R(0,W))} ${q(R(0,H))}h${q(R(1,4))}`}
 return `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" opacity=".6"/><path d="${e}" stroke="${col}" stroke-width="${q(R(4,8))}" stroke-linecap="round" opacity=".7"/>`}
const mid=(a,b)=>`${f2((a[0]+b[0])/2)},${f2((a[1]+b[1])/2)}`;
const GN=['Halftone Streaks','Halftone Blobs','Grunge Creases','Film Dust','Glitch Bands','Gradient Mesh','Liquid Waves','Dot Circles','Low-Poly','Concentric Rings','Diagonal Stripes','Paper Stains','Topo Contours','Plus Grid','Hatch Texture','Sunburst','Organic Blobs','Pixel Mosaic','Flow Lines','Diamond Check','Confetti','Marble Stripes','Ink Splatter','Blueprint','Truchet Arcs','Isometric Cubes','Moire Rings','Memphis Pop','Bauhaus Grid','Seigaiha Waves','Spirograph','Brush Strokes','Constellation','Mondrian Blocks','Aurora Ribbons','Rainbow Arches','Botanical Leaves'];
const GEN=[
(R,P)=>ht(R,P.a,0,0,1)+ht(R,P.b,0,0,2),
(R,P)=>ht(R,P.a,0,1,1)+ht(R,P.c,0,1,2),
(R,P)=>nl(R,'g1',P.a,R(.0012,.003),R(.012,.03),5,.5,10,1)+nl(R,'g2',P.b,R(.001,.004),R(.01,.03),4,.55,8,.6)+scratch(R,P.a,70),
(R,P)=>{let s=`<defs><filter id="bl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="30 ${q(R(10,40))}"/></filter><pattern id="px" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="2.6" height="8" fill="${P.a}" opacity=".35"/><rect x="2.7" width="2.6" height="8" fill="${P.b}" opacity=".35"/><rect x="5.4" width="2.6" height="8" fill="${P.c}" opacity=".35"/></pattern></defs><g filter="url(#bl)">`;
 for(let i=0;i<7;i++)s+=`<rect x="${q(R(-200,W*.5))}" y="${q(R(0,H))}" width="${q(R(W*.4,W*1.1))}" height="${q(R(120,520))}" fill="${pk(R,cols(P))}" opacity="${f2(R(.4,.9))}"/>`;
 return s+`</g><rect width="${W}" height="${H}" fill="url(#px)"/>`+dust(R,P.d,520)+scratch(R,P.d,25)},
(R,P)=>{let s=`<defs><filter id="hb" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur stdDeviation="${q(R(20,80))} 2"/></filter><pattern id="sl" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="3" fill="#000" opacity=".25"/></pattern></defs><g filter="url(#hb)">`;
 for(let y=0;y<H;y+=R(40,260)*.8)s+=`<rect x="${q(R(-300,300))}" y="${q(y)}" width="${W+600}" height="${q(R(50,260))}" fill="${pk(R,cols(P))}" opacity="${f2(R(.5,1))}"/>`;
 return s+`</g><rect width="${W}" height="${H}" fill="url(#sl)"/>`},
(R,P)=>{let s=`<defs><filter id="mg" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="${q(R(110,200))}"/></filter></defs><g filter="url(#mg)">`;
 for(let i=0,n=q(R(7,11));i<n;i++)s+=`<circle cx="${q(R(0,W))}" cy="${q(R(0,H))}" r="${q(R(400,1100))}" fill="${pk(R,cols(P))}" opacity="${f2(R(.6,1))}"/>`;return s+'</g>'},
(R,P)=>{let s='';const L=q(R(6,11));for(let i=0;i<L;i++){const y=q(H*(.15+.8*i/L)+R(-80,80)),m=q(R(3,9)),st=W/m,a=q(R(80,320));let d=`M0 ${y}Q${q(st/2)} ${y-a} ${q(st)} ${y}`;for(let k=2;k<=m+1;k++)d+=`T${q(st*k)} ${y}`;s+=`<path d="${d}L${W+st} ${H}L0 ${H}Z" fill="${pk(R,cols(P))}" opacity="${f2(R(.55,.95))}"/>`}return s},
(R,P)=>{const sz=q(R(110,200)),ph=R(0,6),fx=R(.002,.008),fy=R(.002,.008);let s='';
 for(let y=sz/2;y<H+sz;y+=sz)for(let x=sz/2;x<W+sz;x+=sz){const v=(Math.sin(x*fx+ph)+Math.cos(y*fy-ph)+2)/4;s+=`<circle cx="${q(x)}" cy="${q(y)}" r="${q(sz*.5*(.15+.85*v))}" fill="${v>.6?P.a:v>.35?P.b:P.c}"/>`}return s},
(R,P)=>{const cs=q(R(180,320)),c=Math.ceil(W/cs)+2,r=Math.ceil(H/cs)+2,pt=[];
 for(let j=0;j<r;j++){pt[j]=[];for(let i=0;i<c;i++)pt[j][i]=[q(i*cs-cs+R(-.35,.35)*cs),q(j*cs-cs+R(-.35,.35)*cs)]}
 let s='';const C=cols(P);for(let j=0;j<r-1;j++)for(let i=0;i<c-1;i++){const a=pt[j][i],b=pt[j][i+1],d=pt[j+1][i],e=pt[j+1][i+1];
 s+=`<path d="M${a}L${b}L${d}Z" fill="${pk(R,C)}" opacity="${f2(R(.35,1))}"/><path d="M${b}L${e}L${d}Z" fill="${pk(R,C)}" opacity="${f2(R(.35,1))}"/>`}return s},
