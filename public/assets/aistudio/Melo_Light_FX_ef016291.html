<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Melo Light FX</title>
<style>
:root{--bg:#09090d;--pn:#14141c;--ln:#ffffff16;--tx:#e9e9f2;--mu:#8d90a3;--ac:#f3b63f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1000px 520px at 72% -12%,#34260f 0,#09090d 62%);color:var(--tx);font:14px system-ui,'Segoe UI',sans-serif;min-height:100vh}
header{padding:14px 20px 6px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:24px;letter-spacing:.4px;background:linear-gradient(90deg,#fff1b8,#f3b63f,#ff9a3c);-webkit-background-clip:text;background-clip:text;color:transparent}
header small{color:var(--mu)}
.app{display:grid;grid-template-columns:360px 1fr;gap:16px;padding:8px 16px 28px;align-items:start}
@media(max-width:920px){.app{grid-template-columns:1fr}}
aside{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:10px;max-height:calc(100vh - 70px);overflow:auto;position:sticky;top:10px}
@media(max-width:920px){aside{position:static;max-height:none}}
details{border:1px solid var(--ln);border-radius:10px;margin-bottom:8px;background:#ffffff05}
summary{cursor:pointer;padding:9px 12px;font-weight:700;color:#f6e3b0;list-style:none;display:flex;justify-content:space-between}
summary::after{content:'▾';color:var(--mu)}details[open] summary::after{content:'▴'}
.in{padding:4px 12px 10px}
.sl{margin:7px 0}
.sl label{display:flex;justify-content:space-between;color:#c4c7d6;font-size:12.5px}
.sl output{color:var(--ac);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ac);margin:2px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:7px 0}
.row label{display:flex;gap:6px;align-items:center;color:#c4c7d6;font-size:13px}
button,select,input[type=text]{font:inherit;border:1px solid var(--ln);border-radius:9px;padding:9px 12px;cursor:pointer;background:#222532;color:#fff}
input[type=text]{cursor:text;flex:1;min-width:120px}
button:hover{background:#2f3344}
button.main{background:linear-gradient(135deg,#f3b63f,#ff8a3c);color:#1a1000;font-weight:800;font-size:16px;padding:12px 26px;border:0;box-shadow:0 6px 22px #f3b63f44}
button.main:hover{filter:brightness(1.1)}
button.dl{background:#0f9b7a;border:0}button.dl:hover{background:#13b891}
input[type=color]{width:36px;height:30px;border:0;padding:0;background:none;cursor:pointer}
.stagebox{display:flex;flex-direction:column;align-items:center;min-width:0}
.stage{background:#000;border-radius:10px;overflow:hidden;box-shadow:0 14px 50px #000c;width:100%}
.stage svg{width:100%;height:100%;display:block}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:14px 0 6px}
#info{text-align:center;color:#c4c7d6;margin:4px 0}
.hint{color:var(--mu);font-size:12px;text-align:center;max-width:720px}
#tbox.off{opacity:.35;pointer-events:none}
</style></head><body>

 const fbm=(x,y,o)=>{let a=.5,s=0,t=0,fr=1;for(let k=0;k<o;k++){s+=a*n2(x*fr+k*17.3,y*fr+k*9.1);t+=a;a*=.5;fr*=2.03}return s/t};

 return{w,h,name:`${F.n} · ${pal.n}`,svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs>${defs}</defs>${body}</svg>`}}
// ---------- UI ----------
const SIZES=[['3840x2160','16:9 – 4K (3840×2160)'],['2500x1500','Canva 2500×1500'],['3000x3000','Square 3000×3000'],['2400x3200','Portrait 3:4 (2400×3200)'],['2160x3840','Story 9:16 (2160×3840)'],['3840x1440','Banner 8:3 (3840×1440)']];
const $=id=>typeof document!=='undefined'&&document.getElementById(id);
if(typeof document!=='undefined'){
const P={...DEF};let hist=[],pos=-1,deck=[],cur=null,svgStr='',dims=[3840,2160];const used=new Set();
$('size').innerHTML=SIZES.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join('');
const sc=$('sliders');SL.forEach((g,gi)=>{const d=document.createElement('details');if(gi<2)d.open=true;d.innerHTML=`<summary>${g[0]}</summary><div class="in"></div>`;const box=d.querySelector('.in');
 g[1].forEach(s=>{const el=document.createElement('div');el.className='sl';el.innerHTML=`<label>${s[1]}<output>${s[2]}</output></label><input type="range" min="0" max="100" value="${s[2]}" data-k="${s[0]}">`;box.appendChild(el)});sc.appendChild(d)});
const inputs={};sc.querySelectorAll('input').forEach(i=>inputs[i.dataset.k]=i);
function setP(k,v){P[k]=v;inputs[k].value=v;inputs[k].previousElementSibling.querySelector('output').textContent=v}
let raf=0;const redraw=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>cur&&render(cur))};
sc.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;setP(k,+e.target.value);redraw()});
sc.addEventListener('dblclick',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){setP(k,DEF[k]);redraw()}});
const getT=()=>({on:$('ton').checked,main:$('tmain').value,sub:$('tsub').value,font:$('tfont').value.split('|'),pos:$('tpos').value,col:$('tcol').value,size:+$('tsz').value/100});
function render(it){const[w,h]=$('size').value.split('x').map(Number),cc=$('ccon').checked?{bg:$('cbg').value,ink:$('cink').value}:null,o=build(it.fi,it.pi,it.seed,P,getT(),w,h,cc);
 cur=it;svgStr=o.svg;dims=[w,h];const st=$('stage');st.style.aspectRatio=`${w}/${h}`;st.style.maxWidth=`min(100%,calc((100vh - 190px)*${(w/h).toFixed(4)}))`;st.innerHTML=svgStr;
 const kb=svgStr.length/1024;$('info').innerHTML=`<b>${o.name}</b> • Style ${it.fi*NP+it.pi+1}/${TOTAL} • ${w}×${h} • SVG ≈ ${kb>1024?(kb/1024).toFixed(1)+' MB':kb.toFixed(0)+' KB'}`}
function shuffle(){deck=[...Array(TOTAL).keys()];for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
function vary(){const A=(k,s)=>setP(k,Math.round(cl(DEF[k]+(Math.random()*2-1)*s,0,100)));['density','size','sizevar','glowsize','glowstr','stars','spread','curve','noise','contrast','bokeh','bokehsize'].forEach(k=>A(k,22));A('angle',22);A('zoom',16);A('offx',14);A('offy',12);A('confetti',20);A('ribbon',20)}
function next(){if(pos<hist.length-1){pos++;render(hist[pos]);return}if(!deck.length)shuffle();const s=deck.pop();let seed;do{seed=crypto.getRandomValues(new Uint32Array(1))[0]}while(used.has(seed));used.add(seed);
 if($('auto').checked)vary();hist.push({fi:(s/NP)|0,pi:s%NP,seed,P:{...P}});if(hist.length>60){hist.shift()}pos=hist.length-1;render(hist[pos])}
function newDesign(){pos=hist.length-1;next()}
$('gen').onclick=newDesign;
$('prev').onclick=()=>{if(pos>0){pos--;const it=hist[pos];KEYS.forEach(k=>setP(k,it.P[k]));render(it)}};
$('rst').onclick=()=>{KEYS.forEach(k=>setP(k,DEF[k]));redraw()};
$('rnd').onclick=()=>{KEYS.forEach(k=>{if(k=='clear')return;setP(k,Math.round(15+Math.random()*70))});redraw()};
$('size').onchange=redraw;
$('ton').onchange=()=>{$('tbox').classList.toggle('off',!$('ton').checked);redraw()};
['tmain','tsub','tfont','tpos','tcol','tsz','ccon','cbg','cink'].forEach(id=>{$(id).addEventListener('input',redraw);$(id).addEventListener('change',redraw)});
function save(b,ext){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`glitter-${cur.fi*NP+cur.pi+1}-${cur.seed%10000}${ext}`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2500)}
$('dsvg').onclick=()=>save(new Blob([svgStr],{type:'image/svg+xml'}),'.svg');
function raster(type,ext){const[w,h]=dims,u=URL.createObjectURL(new Blob([svgStr],{type:'image/svg+xml'})),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#000';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);c.toBlob(b=>save(b,ext),type,.93);URL.revokeObjectURL(u)};im.src=u}
$('dpng').onclick=()=>raster('image/png','.png');$('djpg').onclick=()=>raster('image/jpeg','.jpg');
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['SELECT','INPUT','BUTTON','TEXTAREA'].includes(e.target.tagName)){e.preventDefault();newDesign()}});
shuffle();next();
}
</script></body></html>
